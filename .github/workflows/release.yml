name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Apple Silicon requires macOS 11 or newer; keep release binaries aligned
  # with the documented Metal support baseline.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: graphiq-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: graphiq-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: graphiq-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: graphiq-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artifact: graphiq-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Configure cross-compile linker (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"' > .cargo/config.toml

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features gpu

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in graphiq graphiq-mcp graphiq-bench; do
            test -f "target/${{ matrix.target }}/release/$bin"
            cp "target/${{ matrix.target }}/release/$bin" dist/
          done
          cd dist && tar czf "${{ matrix.artifact }}.tar.gz" -- *
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $binaries = @('graphiq.exe', 'graphiq-mcp.exe', 'graphiq-bench.exe')
          foreach ($binary in $binaries) {
            $source = Join-Path $PWD "target\${{ matrix.target }}\release\$binary"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "missing release binary: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $dist $binary)
          }
          $archiveName = '${{ matrix.artifact }}.zip'
          $archive = Join-Path $dist $archiveName
          Compress-Archive -Path (Join-Path $dist 'graphiq.exe'), (Join-Path $dist 'graphiq-mcp.exe'), (Join-Path $dist 'graphiq-bench.exe') -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath (Join-Path $dist '${{ matrix.artifact }}.sha256')

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: macos-14

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
          generate_release_notes: true
