name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: graphiq-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: graphiq-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: graphiq-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: graphiq-aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Configure cross-compile linker (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"' > .cargo/config.toml

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --features gpu

      - name: Package
        run: |
          mkdir -p dist
          for bin in graphiq graphiq-mcp graphiq-bench; do
            if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
              cp "target/${{ matrix.target }}/release/$bin" dist/
            fi
          done
          cd dist && tar czf "${{ matrix.artifact }}.tar.gz" *
          shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.sha256

  desktop-macos:
    runs-on: macos-14
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          # Prevent electron-builder from auto-discovering a cert (there's none
          # in CI) — we sign ad-hoc in the next step.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      # Ad-hoc code-sign the .app bundle so macOS Gatekeeper doesn't mark the
      # downloaded DMG as "damaged and can't be opened". Ad-hoc signing (sign
      # with `-`) creates a valid signature that lets users run the app via
      # right-click → Open, instead of the "unidentified developer" / "damaged"
      # block unsigned apps get. This is NOT a full Developer ID + notarization
      # (which requires a paid Apple Developer account) but it removes the
      # worst UX failure: the app being quarantined as malware on first run.
      # When a Developer ID certificate is available, set the CSC_LINK /
      # CSC_KEY_PASSWORD secrets and electron-builder will do full signing.
      - name: Ad-hoc code-sign macOS app
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP="$(find release/mac -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No .app found in release/mac/ — skipping signing"
            exit 0
          fi
          echo "Signing: $APP"
          codesign --force --deep --options runtime --sign - "$APP"
          echo "Verifying signature..."
          codesign --verify --strict --verbose=2 "$APP" 2>&1 | head -5
          echo "Signature verified."

      - name: Rebuild DMG and zip from the signed app
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP="$(find release/mac -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No .app found — skipping DMG rebuild"
            exit 0
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          APP_NAME="$(basename "$APP" .app)"
          # Remove the unsigned artifacts electron-builder produced.
          rm -f release/*.dmg release/*-mac.zip release/*.blockmap
          # Rebuild the DMG from the signed .app (UDZO = compressed).
          DMG="release/${APP_NAME}-${VERSION}-arm64.dmg"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$APP" \
            -ov \
            -fs HFS+ \
            -format UDZO \
            "$DMG"
          echo "Created signed DMG: $DMG"
          # Rebuild the zip from the signed .app.
          ZIP="release/${APP_NAME}-${VERSION}-arm64-mac.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "Created signed zip: $ZIP"
          ls -la release/*.dmg release/*-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: graphiq-desktop-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac.zip

  release:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: macos-14

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*-mac.zip
            artifacts/**/*.blockmap
          generate_release_notes: true
