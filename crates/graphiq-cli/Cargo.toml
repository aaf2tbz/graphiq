[package]
name = "graphiq-cli"
version = "4.3.3"
edition = "2021"

[[bin]]
name = "graphiq"
path = "src/main.rs"

[dependencies]
graphiq-core = { path = "../graphiq-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
rusqlite = "0.34"
tempfile = "3"

[features]
default = []
embed = ["graphiq-core/embed"]
gpu = ["graphiq-core/gpu"]
